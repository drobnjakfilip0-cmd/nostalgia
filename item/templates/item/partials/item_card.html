{% load price_format %}

<a href="{% url 'item:detail' item.id %}"
   class="paper rounded-2xl overflow-hidden hover:-translate-y-1 transition block">

    {% if item.image %}
        <img src="{{ item.image.url }}" class="w-full h-64 object-cover">
    {% else %}
        <div class="w-full h-64 bg-gray-100 flex items-center justify-center text-gray-400 text-sm">No image</div>
    {% endif %}

    <div class="p-5">

        <h2 class="font-black text-lg">
            {{ item.name }}
        </h2>

        <p class="text-gray-500 mt-1">
            {{ item.price|price_format }} RSD
        </p>

    </div>

</a>
