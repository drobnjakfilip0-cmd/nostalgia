{% extends 'core/base.html' %}

{% block title %}Proveri email{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center px-4">

    <div class="paper rounded-2xl p-10 max-w-md w-full text-center shadow-xl">

        <!-- ICON -->
        <div class="text-5xl mb-4">
            📩
        </div>

        <!-- TITLE -->
        <h1 class="text-2xl font-black mb-3">
            Aktivacioni link poslat
        </h1>

        <!-- MESSAGE -->
        <p class="text-gray-600 leading-relaxed mb-6">
            Poslali smo link za aktivaciju naloga na:
        </p>

        <div class="bg-black/5 rounded-xl py-3 px-4 font-semibold text-gray-800 mb-6">
            {{ email }}
        </div>

        <p class="text-gray-500 text-sm">
            Proveri inbox ili spam folder.
        </p>

        <!-- BUTTON BACK -->
        <a href="{% url 'core:login' %}"
           class="inline-block mt-6 px-6 py-3 bg-[#c2410c] text-white font-bold rounded-xl hover:bg-[#9a3412] transition">
            Idi na login
        </a>

    </div>

</div>

{% endblock %}
