<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Aktivacija naloga</title>
</head>

<body style="margin:0; padding:0; background:#f5f5f5; font-family:Arial, sans-serif;">

    <div style="max-width:600px; margin:40px auto; background:white; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1);">

        <!-- HEADER -->
        <div style="background:#c2410c; padding:24px; color:white; text-align:center;">
            <h1 style="margin:0; font-size:20px;">
                Aktivacija naloga
            </h1>
        </div>

        <!-- BODY -->
        <div style="padding:30px; color:#333;">

            <p style="font-size:16px; line-height:1.6;">
                Zdravo,
            </p>

            <p style="font-size:16px; line-height:1.6;">
                Hvala ti na registraciji. Da bi aktivirao nalog, klikni na dugme ispod.
            </p>

            <!-- BUTTON -->
            <div style="text-align:center; margin:30px 0;">
                <a href="{{ activation_link }}"
                   style="background:#c2410c; color:white; padding:12px 24px; border-radius:8px; text-decoration:none; font-weight:bold; display:inline-block;">
                    Aktiviraj nalog
                </a>
            </div>

            <p style="font-size:14px; color:#666;">
                Ako dugme ne radi, kopiraj ovaj link u browser:
            </p>

            <p style="font-size:12px; word-break:break-all; color:#999;">
                {{ activation_link }}
            </p>

        </div>

        <!-- FOOTER -->
        <div style="background:#f1f1f1; padding:16px; text-align:center; font-size:12px; color:#777;">
            Ovaj email je automatski generisan.
        </div>

    </div>

</body>
</html>
