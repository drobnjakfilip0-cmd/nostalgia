<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="margin:0; padding:0; background:#f5f5f5; font-family:Arial, sans-serif;">

    <div style="max-width:600px; margin:20px auto; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,0.1);">

        <!-- HEADER -->
        <div style="background:#c2410c; padding:20px; color:white; text-align:center;">
            <h2 style="margin:0;">Reset lozinke</h2>
        </div>

        <!-- BODY -->
        <div style="padding:30px; color:#333;">

            <p style="font-size:16px; line-height:1.5;">
                Zatražili ste promenu lozinke.
            </p>

            <p style="font-size:16px; line-height:1.5;">
                Kliknite dugme ispod da postavite novu lozinku:
            </p>

            <!-- BUTTON -->
            <div style="text-align:center; margin:30px 0;">
                <a href="{{ protocol }}://{{ domain }}{% url 'core:password_reset_confirm' uidb64=uid token=token %}"
                   style="
                        display:inline-block;
                        background:#c2410c;
                        color:#ffffff;
                        padding:14px 24px;
                        border-radius:10px;
                        text-decoration:none;
                        font-weight:bold;
                        font-size:14px;
                   ">
                    Promeni lozinku
                </a>
            </div>

            <!-- FALLBACK LINK -->
            <p style="font-size:12px; color:#777;">
                Ako dugme ne radi, kopiraj link:
            </p>

            <p style="font-size:11px; word-break:break-all; color:#999;">
                {{ protocol }}://{{ domain }}{% url 'core:password_reset_confirm' uidb64=uid token=token %}
            </p>

        </div>

    </div>

</body>
</html>
