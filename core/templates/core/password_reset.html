{% extends 'core/base.html' %}

{% block title %}Reset lozinke{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center px-4">

    <div class="paper rounded-2xl p-8 w-full max-w-md shadow-xl">

        <h1 class="text-2xl font-black mb-2">
            Reset lozinke
        </h1>

        <p class="text-gray-500 mb-6">
            Unesi email na koji ćemo poslati link za promenu lozinke.
        </p>

        <form method="post" id="resetForm">
            {% csrf_token %}

            <label class="block mb-2 text-sm font-semibold text-gray-700">
                Email adresa
            </label>

            <input type="email"
                   name="email"
                   required
                   class="w-full px-4 py-3 rounded-xl border border-black/10 focus:ring-2 focus:ring-[#c2410c] outline-none mb-6"
                   placeholder="tvoj@email.com">

            <!-- BUTTON -->
            <button type="submit"
                    id="submitBtn"
                    class="w-full py-3 rounded-xl bg-[#c2410c] text-white font-bold hover:bg-[#9a3412] transition">

                Pošalji link

            </button>
        </form>

    </div>

</div>

<!-- TOAST -->


<script>
const form = document.getElementById("resetForm");
const btn = document.getElementById("submitBtn");
const toast = document.getElementById("toast");

form.addEventListener("submit", function () {

    // disable button + loading state
    btn.disabled = true;
    btn.classList.remove("bg-[#c2410c]", "hover:bg-[#9a3412]");
    btn.classList.add("bg-gray-400", "cursor-not-allowed");
    btn.innerText = "Šalje se...";

    // show toast after submit (fake UX feedback)
    setTimeout(() => {
        toast.classList.remove("hidden");

        setTimeout(() => {
            toast.classList.add("hidden");
        }, 3000);

    }, 1500);

});
</script>

{% endblock %}
